[project]
name = "miwbs"
version = "0.1.0"
description = "AIDM MIWBS — VEN-based MUD-like multiverse builder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.scripts]
miwbs = "miwbs.cli:main"
miwbs-help = "miwbs.help_cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
miwbs = ["schema.sql"]
